name: Deploy a producción (Contabo)

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Desplegar vía SSH (build en servidor + smoke)
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.DEPLOY_SSH_HOST }}
          username: ${{ secrets.DEPLOY_SSH_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script_stop: true
          script: |
            cd /var/www/talkaris
            if [ -n "$(git status --porcelain)" ]; then
              echo "Dirty deployment checkout; refusing to deploy" >&2
              exit 1
            fi
            if [ "$(git rev-parse HEAD)" != "${{ github.sha }}" ]; then
              echo "Deployment checkout is not the requested commit; refusing to deploy" >&2
              exit 1
            fi
            sudo /var/www/talkaris/infra/deploy-chat.sh main '${{ github.sha }}'
