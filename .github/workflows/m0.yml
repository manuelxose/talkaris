name: M0 isolated regression baseline
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  migration-upgrades:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: synthetic
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.2'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: node --test scripts/m0/migrations.test.mjs
        env:
          MIGRATION_TEST_DATABASE_URL: postgresql://postgres:synthetic@127.0.0.1:5432/postgres
  localhost:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.2'
          cache: npm
      - run: docker version
      - run: npm ci --no-audit --no-fund
      - run: node --test scripts/m0/entrypoint.test.mjs
      - run: node --test scripts/m0/deploy-guard.test.mjs
      - run: npm run m0:test
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m0-localhost-evidence
          path: evidence/talkaris-m0-*/
          retention-days: 7
