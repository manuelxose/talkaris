name: M0 isolated regression baseline
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  localhost:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.2'
          cache: npm
      - run: docker version
      - run: npm ci --no-audit --no-fund
      - run: node --test scripts/m0/entrypoint.test.mjs
      - run: node --test scripts/m0/deploy-guard.test.mjs
      - run: npm run m0:test
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m0-localhost-evidence
          path: evidence/talkaris-m0-*/
          retention-days: 7
