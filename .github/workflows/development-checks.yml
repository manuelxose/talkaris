name: Development checks
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      NG_BUILD_MAX_WORKERS: '1'
      NG_BUILD_PARALLEL_TS: '0'
      GOMAXPROCS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.2'
          cache: npm
      - run: npm ci
      - run: python3 scripts/ai-development/test_control.py
      - run: node --test scripts/ai-development/evals/provider.test.cjs
      - run: npm test
      - run: npm run build
