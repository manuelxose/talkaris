name: talkaris-m0
services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: talkaris_m0
      POSTGRES_USER: m0
      POSTGRES_PASSWORD: m0-synthetic-only
    ports:
      - "127.0.0.1:45432:5432"
    tmpfs:
      - /var/lib/postgresql/data
    networks: [isolated]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U m0 -d talkaris_m0"]
      interval: 1s
      timeout: 2s
      retries: 60
  mail:
    image: axllent/mailpit:v1.27
    ports:
      - "127.0.0.1:45125:1025"
      - "127.0.0.1:45126:8025"
    networks: [isolated]
networks:
  isolated:
    # Docker 29 internal networks suppress published ports; disable outbound NAT
    # while retaining explicit host-loopback access for native application tests.
    driver_opts:
      com.docker.network.bridge.enable_ip_masquerade: "false"
